name: CI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm install
      - run: npm run lint
      - run: npm run build
