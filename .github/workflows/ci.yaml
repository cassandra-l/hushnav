name: CI Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run lint
      - run: npm run build

  main-checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run lint
      - run: npm run build

  docker-build-check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build forecast image
        uses: docker/build-push-action@v6
        with:
          context: ./database_schema_dataimports
          file: ./database_schema_dataimports/Dockerfile.forecast
          push: false

      - name: Build import image
        uses: docker/build-push-action@v6
        with:
          context: ./database_schema_dataimports
          file: ./database_schema_dataimports/Dockerfile.import
          push: false

  sonar-main:
    if: github.event_name == 'push'
    needs: main-checks
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000